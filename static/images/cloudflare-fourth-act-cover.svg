<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" role="img" aria-labelledby="title desc">
  <title id="title">Cloudflare's fourth act</title>
  <desc id="desc">An agent request enters a highlighted economic layer above three infrastructure layers, then branches into a payment and a sponsored offer.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff4e6"/>
      <stop offset=".52" stop-color="#fff9f2"/>
      <stop offset="1" stop-color="#f3f0ff"/>
    </linearGradient>
    <linearGradient id="economic" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe8cc"/>
      <stop offset="1" stop-color="#ffc078"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#1e293b" flood-opacity=".16"/>
    </filter>
    <marker id="arrowOrange" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M1 1l10 5-10 5" fill="none" stroke="#e8590c" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M1 1l10 5-10 5" fill="none" stroke="#1971c2" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="1600" height="800" fill="url(#background)"/>
  <circle cx="150" cy="90" r="280" fill="#ff922b" opacity=".08"/>
  <circle cx="1510" cy="740" r="330" fill="#9c36b5" opacity=".07"/>

  <!-- Three established infrastructure layers -->
  <g filter="url(#shadow)">
    <rect x="500" y="500" width="600" height="82" rx="28" fill="#eebefa" fill-opacity=".58" stroke="#9c36b5" stroke-width="5"/>
    <path d="M565 541l23-20m-23 20l23 20m50-40l23 20-23 20" fill="none" stroke="#9c36b5" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity=".75"/>

    <rect x="410" y="600" width="780" height="82" rx="28" fill="#a5d8ff" fill-opacity=".58" stroke="#1971c2" stroke-width="5"/>
    <path d="M478 625l32-12 32 12v20c0 21-14 34-32 43-18-9-32-22-32-43z" fill="none" stroke="#1971c2" stroke-width="7" stroke-linejoin="round" opacity=".75"/>

    <rect x="320" y="700" width="960" height="70" rx="28" fill="#b2f2bb" fill-opacity=".6" stroke="#2f9e44" stroke-width="5"/>
    <g fill="#fff" stroke="#2f9e44" stroke-width="5" opacity=".82">
      <circle cx="390" cy="735" r="13"/>
      <circle cx="445" cy="720" r="11"/>
      <circle cx="490" cy="744" r="14"/>
    </g>
    <path d="M402 731l31-8m22 3l23 12" fill="none" stroke="#2f9e44" stroke-width="5" opacity=".72"/>
  </g>

  <!-- Agent request -->
  <g transform="translate(95 185)" filter="url(#shadow)">
    <rect x="0" y="35" width="180" height="132" rx="38" fill="#fff" stroke="#1971c2" stroke-width="7"/>
    <path d="M90 35V8m0 0l-17-18m17 18l17-18" fill="none" stroke="#1971c2" stroke-width="7" stroke-linecap="round"/>
    <circle cx="58" cy="91" r="10" fill="#1971c2"/>
    <circle cx="122" cy="91" r="10" fill="#1971c2"/>
    <path d="M55 128c22 18 48 18 70 0" fill="none" stroke="#1971c2" stroke-width="7" stroke-linecap="round"/>
  </g>
  <path d="M305 285h245" fill="none" stroke="#1971c2" stroke-width="10" stroke-linecap="round" marker-end="url(#arrowBlue)"/>
  <g fill="#1971c2" opacity=".42">
    <circle cx="340" cy="285" r="7"/>
    <circle cx="382" cy="285" r="7"/>
    <circle cx="424" cy="285" r="7"/>
  </g>

  <!-- Prominent fourth layer -->
  <g filter="url(#shadow)">
    <rect x="590" y="220" width="430" height="130" rx="34" fill="url(#economic)" stroke="#e8590c" stroke-width="8"/>
    <path d="M700 285h86m0 0l-25-25m25 25l-25 25M910 285h-86m0 0l25-25m-25 25l25 25" fill="none" stroke="#e8590c" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- The economic layer branches into a payment and a sponsored offer -->
  <path d="M1040 272c85-4 120-58 184-83" fill="none" stroke="#e8590c" stroke-width="10" stroke-linecap="round" marker-end="url(#arrowOrange)"/>
  <path d="M1040 303c88 12 120 94 178 129" fill="none" stroke="#e8590c" stroke-width="10" stroke-linecap="round" marker-end="url(#arrowOrange)"/>

  <!-- Payment -->
  <g transform="translate(1250 95)" filter="url(#shadow)">
    <ellipse cx="105" cy="118" rx="92" ry="38" fill="#ffd8a8" stroke="#f08c00" stroke-width="7"/>
    <path d="M13 118v70c0 21 41 38 92 38s92-17 92-38v-70" fill="#ffe8cc" stroke="#f08c00" stroke-width="7"/>
    <path d="M13 153c0 21 41 38 92 38s92-17 92-38" fill="none" stroke="#f08c00" stroke-width="6" opacity=".8"/>
    <circle cx="105" cy="118" r="19" fill="#fff4e6" stroke="#e8590c" stroke-width="6"/>
  </g>

  <!-- Sponsored offer -->
  <g transform="translate(1230 390)" filter="url(#shadow)">
    <rect width="260" height="175" rx="28" fill="#fff" stroke="#9c36b5" stroke-width="7"/>
    <path d="M54 92h35l61-35v87l-61-32H54z" fill="#eebefa" stroke="#9c36b5" stroke-width="7" stroke-linejoin="round"/>
    <path d="M89 112l15 36" stroke="#9c36b5" stroke-width="9" stroke-linecap="round"/>
    <path d="M180 45l8 16 18 3-13 13 3 18-16-8-16 8 3-18-13-13 18-3z" fill="#ffd43b" stroke="#f08c00" stroke-width="4" stroke-linejoin="round"/>
  </g>
</svg>
